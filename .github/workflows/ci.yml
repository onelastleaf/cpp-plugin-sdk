name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu 24.04
            os: ubuntu-24.04
            compiler: GCC 13
            compiler_package: g++-13
            cc: gcc-13
            cxx: g++-13
            shell: bash
          - platform: Ubuntu 24.04
            os: ubuntu-24.04
            compiler: Clang 18
            compiler_package: clang-18
            cc: clang-18
            cxx: clang++-18
            shell: bash
          - platform: macOS 26
            os: macos-26
            compiler: AppleClang (Xcode 26)
            cc: clang
            cxx: clang++
            shell: bash
          - platform: Windows 2022
            os: windows-2022
            compiler: GCC (UCRT64)
            cc: gcc
            cxx: g++
            shell: msys2 {0}

    steps:
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-grpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-protobuf

      - name: Keep checkout line endings unchanged
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ${{ matrix.compiler_package }} \
            libgrpc++-dev \
            libprotobuf-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            protobuf-compiler-grpc

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install grpc ninja openssl@3 pkg-config protobuf
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DONELASTLEAF_PLUGIN_SDK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build conformance plugin
        run: cmake --build build --target plugin-sdk-conformance --parallel 2

      - name: Check installation
        run: cmake --install build --prefix build/install
